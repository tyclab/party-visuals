<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#07070e">
  <title>Party visuals · TycStation Lightshow</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="party.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="poles" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5aa2ff"/><stop offset="48%" stop-color="#8b6cf0"/><stop offset="100%" stop-color="#ff4a3d"/>
      </linearGradient>
      <symbol id="krake" viewBox="-125 -95 250 250">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
          <g>
            <path d="M-40,22 C-70,24 -97,40 -105,64 C-111,83 -97,95 -85,87 C-76,81 -79,69 -88,69"/>
            <path d="M-28,31 C-50,45 -69,64 -71,88 C-72,105 -59,114 -49,106 C-41,99 -45,88 -54,89"/>
            <path d="M-15,36 C-26,60 -34,82 -30,103 C-27,118 -14,123 -8,113"/>
            <path d="M-5,37 C-7,60 -10,79 -6,95"/>
            <g transform="scale(-1,1)">
              <path d="M-40,22 C-70,24 -97,40 -105,64 C-111,83 -97,95 -85,87 C-76,81 -79,69 -88,69"/>
              <path d="M-28,31 C-50,45 -69,64 -71,88 C-72,105 -59,114 -49,106 C-41,99 -45,88 -54,89"/>
              <path d="M-15,36 C-26,60 -34,82 -30,103 C-27,118 -14,123 -8,113"/>
              <path d="M-5,37 C-7,60 -10,79 -6,95"/>
            </g>
          </g>
          <path d="M-53,-2 C-53,-42 -30,-66 0,-66 C30,-66 53,-42 53,-2 C53,20 30,35 0,35 C-30,35 -53,20 -53,-2 Z" fill="#0b1018"/>
          <g stroke="none" fill="#b48cf5">
            <ellipse cx="-19" cy="-10" rx="7" ry="8.5"/><ellipse cx="19" cy="-10" rx="7" ry="8.5"/>
          </g>
          <path d="M-9,12 C-4,17 4,17 9,12" stroke-width="7"/>
        </g>
      </symbol>
      <symbol id="krake-s" viewBox="-125 -95 250 250">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="17">
          <g>
            <path d="M-34,26 C-70,34 -96,54 -100,80"/>
            <path d="M-14,36 C-28,64 -34,88 -30,108"/>
            <g transform="scale(-1,1)">
              <path d="M-34,26 C-70,34 -96,54 -100,80"/>
              <path d="M-14,36 C-28,64 -34,88 -30,108"/>
            </g>
          </g>
          <path d="M-53,-2 C-53,-42 -30,-66 0,-66 C30,-66 53,-42 53,-2 C53,20 30,35 0,35 C-30,35 -53,20 -53,-2 Z" fill="#0b1018"/>
          <g stroke="none" fill="#b48cf5">
            <ellipse cx="-20" cy="-10" rx="9" ry="10"/><ellipse cx="20" cy="-10" rx="9" ry="10"/>
          </g>
        </g>
      </symbol>
    </defs>
  </svg>

  <header class="site-header">
    <span class="site-wordmark"><svg class="site-mark" aria-hidden="true" focusable="false"><use href="#krake" stroke="url(#poles)"/></svg><span>TycStation Lightshow<span class="cursor" aria-hidden="true"></span></span></span>
    <span class="site-kicker">visuals · NodeCG graphics</span>
  </header>

  <section class="link" aria-live="polite">
    <span class="dot" id="dot"></span>
    <span id="status">…</span>
    <div class="detail" id="detail"></div>
    <div class="detail" id="audioResponse"></div>
  </section>

  <section class="tempo">
    <span class="bpm" id="bpm">—</span>
    <span class="unit">bpm</span>
    <span class="source" id="source"></span>
    <div class="detail" id="phase"></div>
  </section>

  <section class="palette">
    <div class="swatches" id="swatches"></div>
    <div class="detail" id="paletteSource"></div>
    <div class="swatches dim" id="lookSwatches" hidden></div>
  </section>

  <section class="graphic" data-target="wash">
    <h2>Colour wash</h2>
    <button type="button" class="air">…</button>
    <label>Intensity <input type="range" min="0" max="100" step="1"> <output>—</output></label>
  </section>

  <section class="graphic" data-target="bar">
    <h2>Beat bar</h2>
    <button type="button" class="air">…</button>
    <label>Intensity <input type="range" min="0" max="100" step="1"> <output>—</output></label>
  </section>

  <section class="all">
    <button type="button" id="allOff">All off</button>
  </section>

  <details class="urls">
    <summary>OBS and Companion addresses</summary>
    <ul id="urls"></ul>
  </details>

  <script src="../shared/palette.js"></script>
  <script src="party.js"></script>
</body>
</html>
